# 6O2H -- ambient-temperature triclinic hen lysozyme, P1, 1.21 A.
#
# The next major benchmark after 1UBQ. Its associated diffuse-scattering map is recorded
# under input.diffuse_h5 so `fieldrefine inspect-h5` can describe it, but v3 uses Bragg
# observations ONLY. Diffuse scattering is a separate, later formulation.
#
# Fetch the data first:
#   uv run fieldrefine init-pdb 6O2H --force
run:
  output_dir: ../../runs/6O2H
  seed: 20260907
  enable_x64: false
  compilation_cache_dir: ../../runs/6O2H/xla_cache

input:
  reflections: ../../data/6o2h/6o2h-sf.cif
  model: ../../data/6o2h/6o2h.cif
  diffuse_h5: ../../data/6o2h/triclinic_lysozyme_maps.h5
  scattering: xray
  observation_kind: amplitude
  columns:
    observation: FP
    sigma: SIGFP
    free: FREE
  # Verify with `fieldrefine inspect` before production: `prepare` aborts if this value
  # does not select 2-10% of reflections.
  free_test_value: 0
  expected_free_fraction_min: 0.02
  expected_free_fraction_max: 0.10

split:
  strategy: existing_free_then_hash
  tune_fraction_of_work: 0.10
  final_fraction_if_hash: 0.05
  pair_friedel_when_nonanomalous: true
  anomalous: false

resolution:
  d_min_angstrom: 1.21
  d_max_angstrom: null

grid:
  shape: null
  samples_per_dmin: 3.0

prior:
  kernel: matern
  tau_density: 0.040
  correlation_length_angstrom: 0.75
  alpha: 2.5
  components: []
  remove_mean: true
  latent_distribution: gaussian
  student_t_df: 4.0
  laplace_softening: 1.0e-3
  cauchy_scale: 1.0

baseline:
  density_cutoff: 1.0e-6
  bulk_solvent:
    enabled: true
    radii: refmac
    k_sol: 0.35
    b_sol_angstrom2: 46.0
  scaling:
    enabled: true
    fit_isotropic_b_first: true

likelihood:
  global_scale: profile
  fixed_scale: 1.0
  sigma_floor: 1.0e-6
  loss: gaussian
  student_t_df: 6.0

optimizer:
  method: lbfgs
  fit_scope: train
  max_iterations: 300
  tolerance: 2.0e-5
  lbfgs_memory: 10
  adam_learning_rate: 3.0e-3
  checkpoint_every: 10
  validation_patience: 8
  validation_min_delta: 1.0e-5

information:
  n_modes: 16
  max_iterations: 100
  tolerance: 1.0e-4
  memory_budget_gib: 60.0

atomic_benchmark:
  enabled: true
  n_atoms: 8
  coordinate_delta_angstrom: 0.02
  b_delta_angstrom2: 0.5
  occupancy_delta: 0.02
