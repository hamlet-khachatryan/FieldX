run:
  output_dir: run/6O2H
  shared_data_dir: run/6O2H/shared
  seed: 20260906
  enable_x64: false
  compilation_cache_dir: run/6O2H/xla_cache

input:
  reflections: data/6O2H/6O2H.mtz
  model: data/6O2H/6O2H.cif
  diffuse_h5: data/6O2H/triclinic_lysozyme_maps.h5
  scattering: xray
  observation_kind: amplitude
  columns:
    observation: FP
    sigma: SIGFP
    free: FREE
  free_test_value: 0
  expected_free_fraction_min: 0.02
  expected_free_fraction_max: 0.10

split:
  strategy: existing_free_then_hash
  tune_fraction_of_work: 0.10
  final_fraction_if_hash: 0.05
  pair_friedel_when_nonanomalous: true
  anomalous: false

resolution:
  d_min_angstrom: 1.21
  d_max_angstrom: null

grid:
  shape: null
  samples_per_dmin: 3.0

prior:
  kernel: matern
  tau_density: 0.04
  correlation_length_angstrom: 0.75
  alpha: 2.5
  components: []
  remove_mean: true
  latent_distribution: gaussian
  student_t_df: 4.0
  laplace_softening: 1.0e-3
  cauchy_scale: 1.0

baseline:
  refmac_compatible_density_blur: false
  density_cutoff: 1.0e-6
  bulk_solvent:
    enabled: true
    radii: refmac
    k_sol: 0.35
    b_sol_angstrom2: 46.0
  scaling:
    enabled: true
    fit_isotropic_b_first: true

likelihood:
  global_scale: fixed
  fixed_scale: 1.0
  sigma_floor: 1.0e-6
  loss: gaussian
  student_t_df: 6.0

optimizer:
  method: lbfgs
  fit_scope: train
  max_iterations: 400
  tolerance: 2.0e-5
  lbfgs_memory: 10
  adam_learning_rate: 3.0e-3
  checkpoint_every: 10
  validation_patience: 8
  validation_min_delta: 1.0e-5

information:
  n_modes: 24
  max_iterations: 100
  tolerance: 1.0e-4

atomic_benchmark:
  enabled: true
  n_atoms: 8
  coordinate_delta_angstrom: 0.02
  b_delta_angstrom2: 0.5
  occupancy_delta: 0.02
