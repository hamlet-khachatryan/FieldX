# Reference template. You normally do NOT write this by hand:
#
#   uv run fieldrefine init-pdb <PDBID>
#
# generates the same structure with the entry's real cell, space group, resolution
# range, reflection columns and free-flag convention, plus a dataset prior grid.
#
# Relative paths are resolved against the directory containing this file.
run:
  output_dir: ../runs/PDBID
  seed: 20260907
  enable_x64: false

input:
  reflections: ../data/pdbid/pdbid-sf.cif
  model: ../data/pdbid/pdbid.cif
  scattering: xray
  observation_kind: amplitude
  columns:
    observation: FP
    sigma: SIGFP
    free: FREE
  free_test_value: 0
  expected_free_fraction_min: 0.02
  expected_free_fraction_max: 0.15

split:
  # existing_free_then_hash uses the deposited free flags. Use `hash` only when the
  # entry deposits no usable free set; the result is then a held-out test statistic,
  # not the deposited crystallographic R-free. Use `none` only when no holdout is
  # possible at all: the target becomes R_work alone, nothing errors, and no
  # cross-validated claim can be made from the run.
  strategy: existing_free_then_hash
  tune_fraction_of_work: 0.10
  final_fraction_if_hash: 0.10
  pair_friedel_when_nonanomalous: true
  anomalous: false

resolution:
  d_min_angstrom: 2.0
  d_max_angstrom: null

grid:
  shape: null
  samples_per_dmin: 3.0

prior:
  kernel: matern
  tau_density: 0.040
  correlation_length_angstrom: 0.75
  alpha: 2.5
  components: []
  remove_mean: true
  latent_distribution: gaussian
  student_t_df: 4.0
  laplace_softening: 1.0e-3
  cauchy_scale: 1.0

baseline:
  density_cutoff: 1.0e-6
  bulk_solvent:
    enabled: true
    radii: refmac
    k_sol: 0.35
    b_sol_angstrom2: 46.0
  scaling:
    enabled: true
    fit_isotropic_b_first: true

likelihood:
  global_scale: profile
  fixed_scale: 1.0
  sigma_floor: 1.0e-6
  loss: gaussian
  student_t_df: 6.0

optimizer:
  method: lbfgs
  fit_scope: train
  max_iterations: 100
  tolerance: 5.0e-5
  lbfgs_memory: 8
  adam_learning_rate: 3.0e-3
  checkpoint_every: 10
  validation_patience: 8
  validation_min_delta: 1.0e-5

information:
  n_modes: 8
  max_iterations: 80
  tolerance: 1.0e-4
  memory_budget_gib: 40.0

atomic_benchmark:
  enabled: true
  n_atoms: 8
  coordinate_delta_angstrom: 0.02
  b_delta_angstrom2: 0.5
  occupancy_delta: 0.02
