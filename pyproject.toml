[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldrefine"
version = "0.3.0"
description = "Correlated density-field refinement of crystallographic electron density beyond the atomic model manifold"
readme = "README.md"
license = {file = "LICENSE"}
# Upper bound is not cosmetic: a clean `uv sync` with no bound picks the newest
# interpreter it can install, which silently landed a rebuild on 3.14 where the
# JAX CUDA wheels had no matching build. CI validates 3.11-3.13; allow exactly that.
requires-python = ">=3.11,<3.14"
authors = [{name = "FieldX contributors"}]
keywords = ["crystallography", "electron-density", "jax", "gemmi", "bayesian-inference"]
dependencies = [
  "gemmi>=0.7.5,<0.8",
  "reciprocalspaceship>=1.0.7,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "h5py>=3.12,<4",
  # Bessel functions for sigma-A figures of merit. Already a jax dependency, but
  # crystal_field.analysis.sigmaa imports it directly, so it is declared here.
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
# Exactly one accelerator extra per environment. cpu is for laptops, login nodes and CI.
#
# Choose the CUDA extra by the GPU's COMPUTE CAPABILITY, not by the toolkit the site's
# `module load cuda` happens to provide. CUDA 13 dropped Volta: its ptxas cannot emit
# code for compute capability 7.0, and the failure surfaces as the misleading
# "ptxas too old" rather than "this GPU is unsupported".
#
#   compute capability 7.0        (V100)              -> cuda12
#   compute capability 7.5 - 9.0  (T4, A100, H100)    -> either
#   compute capability 10.0+      (Blackwell)         -> cuda13
#
# Check with: nvidia-smi --query-gpu=name,compute_cap --format=csv
cpu = ["jax>=0.7,<1", "optax>=0.2.5,<1"]
cuda12 = ["jax[cuda12]>=0.7,<1", "optax>=0.2.5,<1"]
cuda13 = ["jax[cuda13]>=0.7,<1", "optax>=0.2.5,<1"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
fieldrefine = "crystal_field.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [
  [{extra = "cpu"}, {extra = "cuda12"}],
  [{extra = "cpu"}, {extra = "cuda13"}],
  [{extra = "cuda12"}, {extra = "cuda13"}],
]
environments = ["sys_platform != 'Windows'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: multi-module tests on a small synthetic dataset; safe on CPU",
  "gpu: requires a JAX accelerator; run only through slurm/40_gpu_tests.sbatch",
  "cluster: expensive end-to-end tests; never run in CI",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
